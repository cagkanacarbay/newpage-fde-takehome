name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the locked Python environment
        run: uv sync --locked
      - name: Check Python formatting
        run: uv run ruff format --check src tests scripts
      - name: Run Ruff
        run: uv run ruff check src tests scripts
      - name: Run strict mypy
        run: uv run mypy
      - name: Run unit and fixture citation tests
        run: uv run pytest -m "not e2e"
      - name: Run focused integration tests
        run: >-
          uv run pytest -m "e2e and not slow"
          --ignore=tests/test_container.py
          --ignore=tests/test_evaluation.py

  retrieval-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            retrieval:
              - '.github/workflows/ci.yml'
              - 'data/corpus/longevity/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'scripts/reindex_golden_retrieval_fixture.py'
              - 'src/live_long_rnd/api/retrieval.py'
              - 'src/live_long_rnd/calibration.py'
              - 'src/live_long_rnd/embeddings.py'
              - 'src/live_long_rnd/evaluation.py'
              - 'src/live_long_rnd/golden_embeddings.py'
              - 'src/live_long_rnd/index_config.py'
              - 'src/live_long_rnd/ingest.py'
              - 'src/live_long_rnd/parsing.py'
              - 'src/live_long_rnd/query_planning.py'
              - 'src/live_long_rnd/retrieve.py'
              - 'tests/api/test_live_retrieval.py'
              - 'tests/test_calibration.py'
              - 'tests/test_evaluation.py'
              - 'tests/test_query_planning.py'
              - 'tests/test_retrieve.py'
              - 'tests/fixtures/golden_retrieval_index/**'
      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.retrieval == 'true'
        with:
          enable-cache: true
      - if: steps.changes.outputs.retrieval == 'true'
        run: uv sync --locked
      - name: Download and verify pinned FlashRank artifact
        if: steps.changes.outputs.retrieval == 'true'
        run: uv run python -c "from live_long_rnd.flashrank_artifact import prepare_flashrank_model; prepare_flashrank_model()"
      - name: Enforce 24-item retrieval quality gates
        if: steps.changes.outputs.retrieval == 'true'
        run: uv run pytest tests/test_evaluation.py::test_retrieval_quality_gates_block_regressions

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the locked web environment
        run: pnpm install --frozen-lockfile
      - name: Run web tests
        run: pnpm test
      - name: Run ESLint
        run: pnpm lint
      - name: Build the static Next.js application
        run: NEXT_PUBLIC_API_BASE_URL=. pnpm build
